    notes: |-
      游戏版本 v4.13.4m，游戏为 32 位 x86 程序（Steam 版）。通过 Steam 启动后 il2fb.exe 存活约 60~90 秒，
      期间无任何游戏画面，随后收到 SIGSEGV（signal 11）崩溃退出。当天三次启动现象完全一致。

      日志关键行：
      [E] [WL_NAPI] [ProcReg] NCP child pid=30811 terminated signal/reason=11(0xb) name=Segmentation fault
      [W] [WL_NAPI] [ProcReg] complete pid=30811 name=il2fb.exe exit=11 source=ncp-exit
      （pid 23977、28489 等三次记录相同，详见附件日志）

      崩溃进程为 Z:\Steam\steamapps\common\IL 2 Sturmovik 1946\il2fb.exe。
      该游戏启动器捆绑自带 HotSpot JVM 1.3.1（bin\hotspot\jvm.dll）；
      同一文件在 PC 端 Windows 11 下亦启动即 BEX（c0000005，故障模块 jvm.dll，
      事件查看器记录可应要求提供），佐证为游戏自带 JVM 的兼容性问题。

      已验证无效：dxvk2.6、dxvk1.10、VirGL 渲染路径。
      现象与渲染后端选择无相关性。

      [旧柚Pro 日志.zip](https://github.com/user-attachments/files/33623912/Pro.zip)
